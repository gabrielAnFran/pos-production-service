apiVersion: v1
kind: Service
metadata:
  name: {{ include "production-service.fullname" . }}
  labels:
    {{- include "production-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.server.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "production-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
