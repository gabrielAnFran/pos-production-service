name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # The testcontainers-based integration suite (build tag `integration`)
      # provisions its own single-node replica-set Mongo and its own
      # RabbitMQ container via Docker (available on ubuntu-latest runners),
      # so no `services:` block or manually-managed containers are needed
      # here -- unit and integration tests run together for one honest
      # coverage number. One retry/DLQ test deliberately runs for several
      # minutes to exercise the real retry-queue TTL.
      # -coverpkg=./... is required for an honest total: db and messaging
      # are exercised only by the external tests/integration package, so
      # without it their coverage is under-reported as 0%.
      - name: go test (unit + integration)
        run: go test -tags=integration ./... -coverpkg=./... -coverprofile=coverage.out
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build --build-arg CMD=server -t pos-production-service:server .
      - name: Build worker image
        run: docker build --build-arg CMD=worker -t pos-production-service:worker .
