name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # NOTE: GH Actions `services:` containers can't take a custom command
      # (e.g. `--replSet rs0`) at container-create time, so this mongo
      # service starts as a plain standalone. We initiate it as a
      # single-node replica set here so `go test ./...` (which touches
      # execution_repository_mongo.go's session.WithTransaction calls
      # indirectly through any code path that dials Mongo) has a working
      # target. The dedicated testcontainers-based integration suite
      # (`make test-integration`, build tag `integration`) is NOT run in CI
      # -- it provisions its own single-node replica-set container via the
      # testcontainers mongodb module and is intended to run locally / via
      # docker-compose, documented in README.md.
      - name: Initiate mongo replica set
        run: |
          docker run --rm --network host mongo:7 mongosh --host localhost:27017 --eval 'rs.initiate()'
      - name: go test
        run: go test ./... -coverprofile=coverage.out
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build --build-arg CMD=server -t pos-production-service:server .
      - name: Build worker image
        run: docker build --build-arg CMD=worker -t pos-production-service:worker .
